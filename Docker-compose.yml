services:
  app:
    image: educapp-php
    container_name: educapp_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: educapp
      DB_USERNAME: root
      DB_PASSWORD: "1234"
    depends_on:
      - db
    networks:
      - red_privada
    command: sh -c "composer install && php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: mysql:8.0
    container_name: educapp_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: educapp
    ports:
      - "3307:3306"
    networks:
      - red_privada
    volumes:
      - educapp_mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: educapp_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"
    networks:
      - red_privada
    depends_on:
      - db

volumes:
  educapp_mysql_data:

networks:
  red_privada:
    driver: bridge