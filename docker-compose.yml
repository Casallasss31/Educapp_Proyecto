services:
  app:
    container_name: educapp_api
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - red_privada

  mysql:
    image: mysql:8.0
    container_name: educapp_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: educapp
      MYSQL_ROOT_PASSWORD: "1234"
    ports:
      - "3308:3306"
    volumes:
      - educapp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - red_privada

  postgres:
    image: postgres:16-alpine
    container_name: educapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: educapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5432:5432"
    volumes:
      - educapp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d educapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - red_privada

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: educapp_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@educapp.com
      PGADMIN_DEFAULT_PASSWORD: "1234"
    ports:
      - "8082:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - red_privada

volumes:
  educapp_mysql_data:
  educapp_postgres_data:

networks:
  red_privada:
    driver: bridge