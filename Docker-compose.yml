services:
  app:
    container_name: educapp_api
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - red_privada

  mysql:
    image: mysql:8.0
    container_name: educapp_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: educapp
      MYSQL_ROOT_PASSWORD: "1234"
    ports:
      - "3308:3306"
    volumes:
      - educapp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - red_privada

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: educapp_pgadmin_container
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - red_privada

volumes:
  educapp_mysql_data:

networks:
  red_privada:
    driver: bridge
